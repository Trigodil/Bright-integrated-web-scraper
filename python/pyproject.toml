[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brightscrape"
version = "0.1.0"
description = "Open source web scraper powered by Bright Data Web Unlocker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brightscrape = "brightscrape.cli:main"

[tool.setuptools]
packages = ["brightscrape"]
